; PHP-FPM for NEP's web interface (zlg-web-fpm.service).
;
; Its own master, separate from Debian's php8.4-fpm.service (which stays
; disabled), so it can run with zlg-time.so preloaded: NEP's code expects
; the clock on local time labelled UTC, as on ZLG's system.

[global]
pid = /run/zlg-web/php-fpm.pid
; to the journal (journalctl -u zlg-web-fpm); /proc/self/fd/2 can't be
; reopened when stderr is the journal's socket
error_log = syslog
syslog.ident = zlg-web-fpm
log_level = notice
daemonize = no
emergency_restart_threshold = 5
emergency_restart_interval = 1m

[zlg]
user = www-data
group = www-data
listen = /run/zlg-web/php.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0600

; inside ZLG's system copy, where NEP's code finds /root/Gateway, /opt and
; ZLG's shell tools (it runs date, ifconfig, df, ... for its pages)
chroot = /srv/zlg
chdir = /

; 256 MB of RAM: few workers, started on demand
pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 60s
pm.max_requests = 500
request_terminate_timeout = 120s

catch_workers_output = yes
decorate_workers_output = no
clear_env = yes
env[PATH] = /m6g2c/bin:/sbin:/bin:/usr/sbin:/usr/bin:/usr/local/bin
env[TZ] = UTC0
env[LD_PRELOAD] = /m6g2c/lib/zlg-time.so
env[LD_LIBRARY_PATH] = /lib:/usr/lib:/usr/local/lib

security.limit_extensions = .php

php_admin_value[date.timezone] = UTC
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_reporting] = E_ALL & ~E_DEPRECATED & ~E_STRICT & ~E_NOTICE & ~E_WARNING
php_admin_flag[expose_php] = off
php_admin_value[memory_limit] = 32M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 2M
php_admin_flag[allow_url_include] = off
php_admin_value[session.save_path] = /tmp/zlg-web-sess
php_admin_flag[session.cookie_httponly] = on
php_admin_value[session.cookie_samesite] = Lax
