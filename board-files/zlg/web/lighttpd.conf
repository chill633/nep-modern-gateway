# lighttpd for NEP's web interface, ported to PHP 8.4 (zlg-web.service).
# Serves /srv/zlg/www (built by zlg-web-port) and NEP's static files; PHP
# runs in zlg-web-fpm.service, inside /srv/zlg.
#
# The port comes from ZLG_WEB_PORT in /etc/default/zlg: 8080 while the new
# server runs next to ZLG's own (zlg-httpd, port 80), 80 once it replaces it.

server.modules = (
	"mod_access",
	"mod_alias",
	"mod_rewrite",
	"mod_setenv",
	"mod_fastcgi",
)

server.document-root	= "/srv/zlg/www"
server.port		= env.ZLG_WEB_PORT
server.username		= "www-data"
server.groupname	= "www-data"
server.tag		= ""
# no server.errorlog: lighttpd then writes to the stderr it was started with
# (the journal). Naming /dev/stderr fails: a socket can't be reopened.
server.max-connections	= 32
server.follow-symlink	= "disable"
index-file.names	= ( "index.php", "index.html" )

mimetype.assign = (
	".html"	=> "text/html; charset=utf-8",
	".htm"	=> "text/html; charset=utf-8",
	".css"	=> "text/css; charset=utf-8",
	".js"	=> "text/javascript; charset=utf-8",
	".json"	=> "application/json",
	".txt"	=> "text/plain; charset=utf-8",
	".png"	=> "image/png",
	".jpg"	=> "image/jpeg",
	".jpeg"	=> "image/jpeg",
	".gif"	=> "image/gif",
	".ico"	=> "image/x-icon",
	".svg"	=> "image/svg+xml",
	".woff"	=> "font/woff",
	".woff2" => "font/woff2",
	".ttf"	=> "font/ttf",
	".eot"	=> "application/vnd.ms-fontobject",
	# NEP's status files (nep/static/local/*_status) have no extension
	""	=> "text/plain; charset=utf-8",
)

alias.url = (
	# NEP's images, CSS, JS and the status files its cron jobs write
	"/nep/static/"	=> "/srv/zlg/root/Gateway/nep/static/",
	# Debian's jQuery and jQuery UI (libjs-jquery, libjs-jquery-ui)
	"/javascript/"	=> "/usr/share/javascript/",
	# jQuery Migrate and blockUI (fetch-deps.sh)
	"/zlg-web/js/"	=> "/usr/local/share/zlg/web/deps/js/",
	# this kit's own scripts (zlg-highcharts.js)
	"/zlg-web/local/" => "/usr/local/share/zlg/web/js/",
)

url.rewrite-once = (
	"^/nep/static/.*$"		=> "$0",
	"^/nep/index\.php(/.*)?$"	=> "$0",
	"^/nep/?$"			=> "/nep/index.php/",
	"^/nep/(.*)$"			=> "/nep/index.php/$1",
)

# no PHP outside the front controllers, no backup or hidden files
url.access-deny = ( "~", ".inc", ".bak", ".orig" )
$HTTP["url"] =~ "^/nep/static/.*\.(php|cgi|sh|conf|cfg)$" {
	url.access-deny = ( "" )
}
# NEP's copies of libraries the pages no longer load (old jQuery, jQuery UI,
# blockUI, Highcharts 2, simpletooltip, Modernizr, unused plugins): their
# known XSS issues stay out of reach
$HTTP["url"] =~ "^/nep/static/js/(jquery[^/]*\.js|simpletooltip[^/]*|modernizr[^/]*|poshy/.*|jchart/js/(highcharts[^/]*|adapters/.*|modules/.*))$" {
	url.access-deny = ( "" )
}
$HTTP["url"] =~ "(^|/)\." {
	url.access-deny = ( "" )
}
$HTTP["url"] =~ "^/nep/(application|system)/" {
	url.access-deny = ( "" )
}

fastcgi.server = (
	# CodeIgniter's front controller; the rest of the path is PATH_INFO
	"/nep/index.php" => ((
		"socket"	=> "/run/zlg-web/php.sock",
		"check-local"	=> "disable",
		# PHP is chrooted into /srv/zlg: tell it where its files are there
		"docroot"	=> "/www",
	)),
	"/index.php" => ((
		"socket"	=> "/run/zlg-web/php.sock",
		"check-local"	=> "disable",
		"docroot"	=> "/www",
	)),
)

setenv.add-response-header = (
	"X-Content-Type-Options"	=> "nosniff",
	"X-Frame-Options"		=> "SAMEORIGIN",
	"Referrer-Policy"		=> "same-origin",
)
