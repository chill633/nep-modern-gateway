# Settings for nep-mqtt (README section 7b), installed as /etc/nep-mqtt.conf,
# mode 600: it holds the broker password. Lines left out keep the defaults shown.

# The web interface's Configure page (README 7b) sets the [mqtt] values.

[mqtt]
# Home Assistant's name or IP address; a URL (http://homeassistant.local)
# works too, only its host name is used
host = homeassistant.local
port = 1883
# A Home Assistant user for the gateway (Settings > People > Add person,
# Allow login on)
username = nep
password = CHANGE-ME
#base_topic = nep
#discovery_prefix = homeassistant

[gateway]
# seconds between readings
#interval = 60
#url = http://127.0.0.1/nep/realdata/mod/{n}
# inverters come from NEP's plc_id.conf; to list them by hand: modules = 1-24
#modules =
# raw temperature / this = degrees C. If the inverter temperatures in HA look
# wrong next to the gateway's own display, change this.
#temperature_divisor = 10
