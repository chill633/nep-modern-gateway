# zlg-json: a weewx skin that writes zlg.json, today's readings for the
# NEP gateway's weather line (zlg-weather, ZLG_WEATHER_URL). Install it as a
# report of its own; README section 7a, "Weather from a weewx station".

[CheetahGenerator]
    encoding = utf8
    [[ToDate]]
        [[[zlg]]]
            template = zlg.json.tmpl

[Generators]
    generator_list = weewx.cheetahgenerator.CheetahGenerator
